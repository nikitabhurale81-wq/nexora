# ==========================================================================
# CD — Deploy to Railway on push to main (after CI passes)
# NOTE: Set RAILWAY_TOKEN in GitHub Secrets to enable deployment
# ==========================================================================

name: CD — Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    # Only run if RAILWAY_TOKEN secret is set
    if: ${{ secrets.RAILWAY_TOKEN != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Backend to Railway
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service nexora-backend --detach

      - name: Deployment Success
        run: echo "✅ Backend deployed to Railway!"
